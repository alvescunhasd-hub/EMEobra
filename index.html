let lang=localStorage.getItem('eme_lang')||'fr',page='dashboard',selected=null,previewId=null,filter='',statusFilter='',reqFilter='all';let projects=read('eme_public_demo_projects',window.INITIAL_PROJECTS||[]),requests=read('eme_public_demo_requests',[]);projects=projects.map(p=>{let original=(window.INITIAL_PROJECTS||[]).find(x=>x.code===p.code);return original?{...original,...p,excel:original.excel,areas:{...original.areas,...(p.areas||{})}}:p});for(let p of window.INITIAL_PROJECTS||[])if(!projects.some(x=>x.code===p.code))projects.push(p);if((window.INITIAL_PROJECTS||[]).length && projects.length){try{localStorage.setItem("eme_projects",JSON.stringify(projects))}catch(e){console.warn("Sauvegarde locale indisponible",e)}}function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function persist(){localStorage.setItem('eme_public_demo_projects',JSON.stringify(projects));localStorage.setItem('eme_public_demo_requests',JSON.stringify(requests))}function t(k){return I[lang][k]||k}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return typeof n==='number'?new Intl.NumberFormat(lang==='fr'?'fr-FR':'pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n):'—'}function date(d){if(!d)return '—';let v=new Date(d+'T12:00:00');return isNaN(v)?esc(d):new Intl.DateTimeFormat(lang==='fr'?'fr-FR':'pt-PT').format(v)}function percent(p){let n=Number(p)||0;return Math.round(n<=1?n*100:n)+' %'}function pill(s){let x=String(s||'—');return `<span class="pill ${/alta|urgent/i.test(x)?'high':/resol|ganh|conclu/i.test(x)?'done':''}">${esc(x)}</span>`}function navigate(p,id){page=p;selected=id||null;previewId=null;render()}function head(title,sub,action=''){return `<div class="heading"><div><h2>${title}</h2><div class="muted">${sub}</div></div>${action}</div>`}function stats(){let active=projects.filter(p=>String(p.active).toLowerCase()==='sim').length,amt=projects.reduce((a,p)=>a+(Number(p.sent)||0),0),open=requests.filter(r=>r.status!=='resolved').length;return `<div class="stats">${[[projects.length,t('total')],[active,t('active')],[money(amt),t('sent')],[open,t('pending')]].map(([v,l])=>`<div class="stat"><div class="mark"></div><div class="num">${v}</div><div class="caption">${l}</div></div>`).join('')}</div>`}function table(rows){return `<div class="tablewrap"><table><thead><tr>${['name','client','status','owner','deadline','progress','estimate','amount','next'].map(x=>`<th>${t(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(p=>`<tr class="clickrow" data-openrow="${esc(p.id)}" title="Ouvrir / Abrir"><td><a href="#" data-project="${esc(p.id)}">${esc(p.name)}</a><div class="mini muted">${esc(p.code)}</div></td><td>${esc(p.client)}</td><td>${pill(p.status)}</td><td>${esc(p.owner||'—')}</td><td>${date(p.newDeadline||p.deadline)}</td><td>${progressUI(p.progress)}</td><td><a href="#" data-project="${esc(p.id)}" class="estimate-link" title="${lang==='fr'?'Voir et modifier la fiche':'Ver e editar a ficha'}">${money(p.estimate)}</a></td><td>${money(p.sent)}</td><td><span class="nextaction" title="${esc(p.next||'')}">${esc(p.next||'—')}</span></td></tr>`).join('')||`<tr><td colspan="9" class="empty">${t('noProject')}</td></tr>`}</tbody></table></div>`}function taskCards(arr){return arr.length?arr.map(r=>`<div class="task"><div class="taskhead"><b>${esc(r.type)}</b>${pill(r.status==='resolved'?t('resolved'):r.status==='working'?t('working'):r.status==='waiting'?t('waiting'):t('open'))}</div><p class="muted mini">${esc(projects.find(p=>p.id===r.projectId)?.name||'—')} · ${esc(r.assigned||'—')} · ${date(r.due)}</p><p>${esc(r.description||'')}</p><div class="toolbar" style="margin:8px 0 0"><select aria-label="Statut" data-taskstatus="${esc(r.id)}" style="max-width:170px">${['open','working','waiting','resolved'].map(k=>`<option value="${k}" ${r.status===k?'selected':''}>${t(k)}</option>`).join('')}</select><button class="btn secondary" data-delete="${esc(r.id)}">${t('delete')}</button></div></div>`).join(''):`<div class="empty">${t('noTasks')}</div>`}function previewCard(){if(!previewId)return '';let p=projects.find(x=>x.id===previewId);if(!p)return '';return `<div class="preview-card"><div class="preview-head"><h3>${esc(p.name)} · ${esc(p.code||'')}</h3><button class="btn secondary" data-closepreview>✕</button></div><div class="preview-grid"><div><small>${t('client')}</small><strong>${esc(p.client||'—')}</strong></div><div><small>${t('status')}</small>${pill(p.status)}</div><div><small>${EXTRA[lang].estimateSC}</small><strong>${money(p.estimate)}</strong></div><div><small>${t('sentValue')}</small><strong>${money(p.sent)}</strong></div><div><small>${t('progress')}</small>${progressUI(p.progress)}</div><div><small>${t('next')}</small><strong>${esc(p.next||'—')}</strong></div><div><small>${t('owner')}</small><strong>${esc(p.owner||'—')}</strong></div><div><small>${t('deadline')}</small><strong>${date(p.newDeadline||p.deadline)}</strong></div></div><div style="margin-top:14px"><button class="btn" data-project="${esc(p.id)}">${lang==='fr'?'Ouvrir et modifier la fiche':'Abrir e editar a ficha'}</button></div></div>`}function dashboard(){let inbox=JSON.parse(localStorage.getItem('eme_public_demo_notifications')||'[]');return head(t('dashboard'),t('welcome'),`<button class="btn" data-addrequest>+ ${t('newRequest')}</button>`)+stats()+`<div class="panel" style="margin-bottom:18px"><h3>🔔 ${EXTRA[lang].notification} (${inbox.length})</h3><p class="hint">${EXTRA[lang].alertLocal}</p>${inbox.slice(0,4).map(n=>`<div class="activity"><b>${esc(n.type)} · ${esc(n.assigned)}</b><span class="mini muted">${esc(projects.find(p=>p.id===n.projectId)?.name||'—')} · ${date(n.created)}</span></div>`).join('')||`<div class="hint">—</div>`}</div><div class="columns dashboard-columns"><div class="panel"><div class="heading"><h3>${t('recent')}</h3><button class="btn secondary" data-go="projects">${t('all')}</button></div><p class="hint">${EXTRA[lang].doubleclick} · ${lang==='fr'?'Cliquez sur une ligne pour afficher un aperçu, ou double-cliquez pour modifier':'Clique numa linha para pré-visualizar, ou faça duplo clique para editar'}</p>${table(projects)}${previewCard()}</div><div class="panel"><h3>${t('quick')}</h3>${taskCards(requests.filter(r=>r.status!=='resolved').slice(0,5))}</div></div>`}function projectsView(){let statuses=[...new Set(projects.map(p=>p.status).filter(Boolean))],q=filter.toLowerCase(),arr=projects.filter(p=>(!statusFilter||p.status===statusFilter)&&[p.name,p.client,p.code,p.owner].some(x=>String(x||'').toLowerCase().includes(q)));return head(t('projects'),`${projects.length} ${t('total').toLowerCase()}`,`<button class="btn" data-addproject>+ ${t('newProject')}</button>`)+`<div class="panel"><div class="hint" style="margin-bottom:10px">${EXTRA[lang].doubleclick}</div><div class="toolbar"><input id="search" placeholder="${t('search')}" value="${esc(filter)}"><select id="statusFilter"><option value="">${t('allStatus')}</option>${statuses.map(s=>`<option ${s===statusFilter?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${table(arr)}</div>`}function projectView(){let p=projects.find(x=>x.id===selected);if(!p)return projectsView();return `<button class="back" data-go="projects">${t('back')}</button>`+head(esc(p.name),`${esc(p.code)} · ${esc(p.client)}`,`<button class="btn" data-addrequest="${esc(p.id)}">+ ${t('newRequest')}</button>`)+`<div class="columns"><div><div class="panel"><h3>${t('details')}</h3><form id="projectForm"><div class="grid2">${[['name',t('name')],['client',t('client')],['location',t('location')],['owner',t('owner')],['status',t('status')],['priority',t('priority')],['deadline',t('deadline')],['newDeadline','Nova data resposta'],['estimate',EXTRA[lang].estimateSC],['sent',t('sentValue')],['progress',t('progress')],['next',t('next')]].map(([k,label])=>`<div class="field"><label>${label}</label>${k==='client'?`<select name="client" id="clientSelect">${choices(clients(),p.client)}</select><input id="newClient" placeholder="${EXTRA[lang].newClient}" style="margin-top:6px">`:k==='status'?`<select name="status">${choices(STATUSES,p.status)}</select>`:k==='priority'?`<select name="priority">${choices(PRIORITIES,p.priority)}</select>`:k==='owner'?`<select name="owner">${choices([...new Set([...PEOPLE,p.owner].filter(Boolean))],p.owner)}</select>`:k==='next'?`<select name="next">${choices(NEXT_ACTIONS,p.next,true)}</select>`:k==='progress'?`<input name="progress" type="number" min="0" max="100" step="1" value="${Math.round((Number(p.progress)||0)*100)}"><div id="liveProgress">${progressUI(p.progress)}</div>`:`<input name="${k}" value="${esc(p[k]??'')}" ${k==='deadline'||k==='newDeadline'?'type="date"':k==='estimate'||k==='sent'?'type="number" step="0.01" min="0"':''}>`}</div>`).join('')}</div><div class="panel" style="padding:14px;margin:12px 0"><h3>${lang==='fr'?'Données complémentaires du dossier':'Dados complementares do processo'}</h3><div class="grid2">${[['kind',lang==='fr'?'Type':'Tipo'],['received',lang==='fr'?'Date réception':'Data receção'],['active',lang==='fr'?'Active':'Ativa'],['reference',lang==='fr'?'Valeur de référence (€)':'Valor de referência (€)'],['studyPath',lang==='fr'?'Chemin du dossier étude':'Caminho do estudo'],['direction',lang==='fr'?'Commentaire direction':'Comentário direção']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(p[k]??'')}" ${k==='received'?'type="date"':k==='reference'?'type="number" step="0.01"':''}></div>`).join('')}</div></div><div class="field"><label>${t('history')}</label><textarea name="notes">${esc(p.notes)}</textarea></div><button class="btn" type="submit">${t('save')}</button></form></div><div class="panel" style="margin-top:18px"><h3>${t('area')}</h3><form id="areasForm"><div class="grid2">${Object.entries(p.areas||{}).filter(([k])=>k!=='Total (m²)').map(([k,v])=>`<div class="field"><label>${esc(k)}</label><input name="${esc(k)}" value="${esc(v??'')}" ${k==='Detalhe outros'?'':'type="number" step="0.01" min="0"'}></div>`).join('')}</div><p class="hint">${lang==='fr'?'Total (m²) recalculé lors de l’enregistrement.':'Total (m²) recalculado ao guardar.'}</p><button class="btn" type="submit">${t('save')}</button></form></div></div><div><div class="panel"><h3>${t('actions')}</h3>${taskCards(requests.filter(r=>r.projectId===p.id))}</div><div class="panel" style="margin-top:18px"><h3>${lang==='fr'?'Informations Excel complémentaires':'Informações adicionais do Excel'}</h3>${[['numero','Nº'],['diasRestantes','Dias restantes'],['alerta','Alerta'],['eurM2','€/m²'],['ultimaAtualizacao','Última atualização'],['diasSemAtualizacao','Dias sem atualização'],['dataComentario','Data comentário'],['lido','Lido'],['abrir','Abrir']].map(([k,l])=>`<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 0"><span class="muted">${l}</span><b>${esc(p.excel?.[k]??'—')}</b></div>`).join('')}</div><div class="panel" style="margin-top:18px"><h3>${t('technical')}</h3><p><b>${t('code')}:</b> ${esc(p.code)}</p><p><b>${t('client')}:</b> ${esc(p.client)}</p><p><b>${t('status')}:</b> ${pill(p.status)}</p><p><b>${t('sentValue')}:</b> ${money(p.sent)}</p><p><b>${t('notes')}:</b><br>${esc(p.direction||t('noData'))}</p></div></div></div>`}function requestsView(){let arr=requests.filter(r=>reqFilter==='all'||r.status===reqFilter);return head(t('requests'),t('tasksIntro'),`<button class="btn" data-addrequest>+ ${t('newRequest')}</button>`)+`<div class="panel"><div class="toolbar"><select id="reqFilter"><option value="all">${t('all')}</option>${['open','working','waiting','resolved'].map(k=>`<option value="${k}" ${reqFilter===k?'selected':''}>${t(k)}</option>`).join('')}</select></div>${taskCards(arr)}</div>`}function modal(html){document.getElementById('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><div class="modalheader"><h3>${t('newRequest')}</h3><button class="close" data-close>✕</button></div>${html}</div></div>`}function addRequest(id){modal(`<form id="requestForm"><div class="field"><label>${t('project')}</label><select name="projectId" required>${projects.map(p=>`<option value="${esc(p.id)}" ${id===p.id?'selected':''}>${esc(p.name)} · ${esc(p.code)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>${t('type')}</label><input name="type" required placeholder="${lang==='fr'?'Prix fournisseur, relance client…':'Preço fornecedor, contacto cliente…'}"></div><div class="field"><label>${t('assigned')}</label><select name="assigned" required>${choices(PEOPLE,'',true)}</select></div><div class="field"><label>${t('priority')}</label><select name="priority"><option>Normal</option><option>Alta</option><option>Urgente</option></select></div><div class="field"><label>${t('due')}</label><input name="due" type="date"></div></div><div class="field"><label>${t('description')}</label><textarea name="description" required></textarea></div><div class="field"><label>E-mail du destinataire (facultatif)</label><input name="email" type="email" placeholder="prenom@entreprise.pt"><small>${EXTRA[lang].noticeMail} : envoi manuel, non automatique</small></div><p class="hint">${EXTRA[lang].alertLocal}</p><button class="btn" type="submit">${t('add')}</button> <button class="btn secondary" type="button" data-close>${t('cancel')}</button></form>`)}function addProject(){modal(`<form id="newProjectForm"><div class="grid2"><div class="field"><label>${t('name')}</label><input name="name" required></div><div class="field"><label>${t('code')}</label><input name="code"></div><div class="field"><label>${t('client')}</label><select name="client" id="clientSelect" required><option value="">${EXTRA[lang].chooseExisting}</option>${choices(clients(),'')}</select><input id="newClient" placeholder="${EXTRA[lang].newClient}" style="margin-top:6px"></div><div class="field"><label>${t('owner')}</label><select name="owner">${choices(PEOPLE,'')}</select></div><div class="field"><label>${t('status')}</label><select name="status">${choices(STATUSES,'Recebido')}</select></div><div class="field"><label>${t('priority')}</label><select name="priority">${choices(PRIORITIES,'Média')}</select></div><div class="field"><label>${EXTRA[lang].estimateSC}</label><input name="estimate" type="number" min="0" step="0.01"></div><div class="field"><label>${t('progress')}</label><input name="progress" type="number" min="0" max="100" value="0"><div id="liveProgress">${progressUI(0)}</div></div><div class="field"><label>${t('next')}</label><select name="next">${choices(NEXT_ACTIONS,'A chiffrer')}</select></div><div class="field"><label>${t('deadline')}</label><input name="deadline" type="date"></div></div><button class="btn" type="submit">${t('add')}</button> <button class="btn secondary" type="button" data-close>${t('cancel')}</button></form>`)}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.getElementById('brandline').textContent=t('subtitle');document.getElementById('topTitle').textContent=t(page==='project'?'projects':page);document.getElementById('today').textContent=new Intl.DateTimeFormat(lang==='fr'?'fr-FR':'pt-PT',{dateStyle:'long'}).format(new Date());document.getElementById('nav').innerHTML=[['dashboard','◫'],['projects','▤'],['requests','◉'],['tasks','✓']].map(([k,i])=>`<button data-go="${k}" class="${page===k||page==='project'&&k==='projects'?'active':''}">${i} &nbsp; ${t(k)}</button>`).join('');document.getElementById('view').innerHTML=`<div class="notice">${t('demo')} <button id="importExcelData" class="btn secondary" style="margin-left:14px;padding:6px 12px">${lang==='fr'?'Importer mes dossiers (fichier privé)':'Importar processos (ficheiro privado)'}</button><input type="file" id="importExcelFile" accept=".json,application/json" style="display:none"></div>`+(page==='dashboard'?dashboard():page==='projects'?projectsView():page==='project'?projectView():requestsView())+`<div class="footerline">${t('local')}</div>`}
document.addEventListener('click',e=>{if(e.target.id==='importExcelData'){document.getElementById('importExcelFile')?.click()}});
document.addEventListener('change',async e=>{if(e.target.id!=='importExcelFile')return;let file=e.target.files?.[0];if(!file)return;try{let incoming=JSON.parse(await file.text());if(!Array.isArray(incoming)||!incoming.length||!incoming.every(p=>p&&typeof p==='object'&&p.code&&p.name))throw Error('Format incorrect');let byCode=new Map(projects.map(p=>[String(p.code),p]));let added=0;for(let p of incoming){if(!byCode.has(String(p.code))){projects.push(p);byCode.set(String(p.code),p);added++}}persist();render();alert((lang==='fr'?'Import terminé : ':'Importação concluída: ')+added+(lang==='fr'?' dossiers ajoutés, ':' processos adicionados, ')+(incoming.length-added)+(lang==='fr'?' déjà présents.':' já existentes.'))}catch(err){alert((lang==='fr'?'Impossible de lire le fichier : ':'Não foi possível ler o ficheiro: ')+err.message)}e.target.value=''});
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-project],[data-addrequest],[data-addproject],[data-close],[data-delete],[data-lang],[data-closepreview]');if(!b)return;e.preventDefault();if('closepreview'in b.dataset){previewId=null;render()}else if(b.dataset.lang){lang=b.dataset.lang;localStorage.setItem('eme_lang',lang);render()}else if(b.dataset.go)navigate(b.dataset.go);else if(b.dataset.project)navigate('project',b.dataset.project);else if('addrequest'in b.dataset)addRequest(b.dataset.addrequest);else if('addproject'in b.dataset)addProject();else if('close'in b.dataset)document.getElementById('modalroot').innerHTML='';else if(b.dataset.delete&&confirm(t('confirmDelete'))){requests=requests.filter(r=>r.id!==b.dataset.delete);persist();render()}});document.addEventListener('click',e=>{let row=e.target.closest('[data-openrow]');if(!row||e.target.closest('a,button,select,input'))return;if(page==='dashboard'){previewId=row.dataset.openrow;render()}});document.addEventListener('dblclick',e=>{let row=e.target.closest('[data-openrow]');if(row)navigate('project',row.dataset.openrow)});document.addEventListener('change',e=>{if(e.target.id==='lang'){lang=e.target.value;localStorage.setItem('eme_lang',lang);render()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}if(e.target.id==='reqFilter'){reqFilter=e.target.value;render()}if(e.target.dataset.taskstatus){let r=requests.find(r=>r.id===e.target.dataset.taskstatus);if(r){r.status=e.target.value;persist();render()}}});document.addEventListener('input',e=>{if(e.target.name==='progress'){let v=document.getElementById('liveProgress');if(v)v.innerHTML=progressUI(Math.min(100,Math.max(0,Number(e.target.value)||0))/100)}if(e.target.id==='search'){filter=e.target.value;let pos=e.target.selectionStart;render();let el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}});document.addEventListener('submit',e=>{if(!['projectForm','requestForm','newProjectForm','areasForm'].includes(e.target.id))return;e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(e.target.id!=='requestForm'){let nc=e.target.querySelector('#newClient')?.value.trim();if(nc){f.client=nc;let all=JSON.parse(localStorage.getItem('eme_public_demo_clients')||'[]');if(!all.includes(nc))all.push(nc);localStorage.setItem('eme_public_demo_clients',JSON.stringify(all))}}if(e.target.id==='areasForm'){let p=projects.find(p=>p.id===selected);let a={};for(let [k,v] of Object.entries(f))a[k]=k==='Detalhe outros'?v:(v===''?null:Number(v));a['Total (m²)']=Object.entries(a).filter(([k,v])=>k!=='Detalhe outros'&&typeof v==='number'&&Number.isFinite(v)).reduce((s,[k,v])=>s+v,0);p.areas=a;persist();render();toast(EXTRA[lang].savedToast)}else if(e.target.id==='projectForm'){let p=projects.find(p=>p.id===selected);Object.assign(p,f);p.progress=Math.max(0,Math.min(1,(Number(f.progress)||0)/100));p.sent=f.sent===''?null:Number(f.sent);p.estimate=f.estimate===''?null:Number(f.estimate);p.reference=f.reference===''?null:Number(f.reference);persist();render();toast(EXTRA[lang].savedToast)}else if(e.target.id==='requestForm'){let r={...f,id:'REQ-'+Date.now(),status:'open',created:new Date().toISOString().slice(0,10)};requests.unshift(r);notifyLocal(r);persist();document.getElementById('modalroot').innerHTML='';render();if(r.email&&confirm(EXTRA[lang].noticeMail+' ?')){let subject=encodeURIComponent('EMEobra — '+r.type),body=encodeURIComponent('Affaire : '+(projects.find(p=>p.id===r.projectId)?.name||r.projectId)+'\nDemande : '+r.description+'\nÉchéance : '+(r.due||'—'));window.location.href='mailto:'+encodeURIComponent(r.email)+'?subject='+subject+'&body='+body}}else{let id=f.code||'NEW-'+Date.now();projects.unshift({id,...f,status:f.status||'Recebido',priority:f.priority||'Média',progress:Math.max(0,Math.min(100,Number(f.progress)||0))/100,active:'Sim',areas:{},notes:'',sent:null,estimate:f.estimate===''?null:Number(f.estimate)});persist();document.getElementById('modalroot').innerHTML='';navigate('project',id);toast(EXTRA[lang].savedToast)}});render();
</script></body></html>
